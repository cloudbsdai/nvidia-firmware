# The rule of devd that places the firmware when a graphics adapter of
# NVIDIA is attached to the machine.
#
# The tool fetches the file the adapter needs from download.nvidia.com
# and checks its size and its hash against the pin table before it puts
# it in place.  Nothing is ever taken away by this rule.
#
# The rule is read by devd(8) from the etc/devd directory of the prefix
# the package was built with.  The path of the tool is that prefix: the
# @PREFIX@ in the rule is the prefix of the package.

attach "nvidia[0-9]*" {
	call "@PREFIX@/sbin/nvidia-firmware fetch"
}
